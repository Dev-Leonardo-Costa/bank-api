spring:
  application:
    name: bank-api

  jackson:
    date-format: dd-MM-yyyy'T'HH:mm:ss

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

security:
  jwt:
    expiration: ${SECURITY_JWT_EXPIRATION}


management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics

  endpoint:
    health:
      show-details: always